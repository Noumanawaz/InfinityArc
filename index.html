<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Breathing - Infinity Arc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .title {
            text-align: center;
            padding: 20px;
            font-size: 2.5em;
            color: #4fc3f7;
            text-shadow: 0 0 10px rgba(79, 195, 247, 0.5);
        }

        .subtitle {
            text-align: center;
            font-size: 1.2em;
            color: #81d4fa;
            margin-top: 10px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .controls button,
        .controls input {
            padding: 8px 12px;
            font-size: 1em;
            background: rgba(79, 195, 247, 0.2);
            border: 1px solid #4fc3f7;
            color: #ffffff;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .controls button:hover,
        .controls input:hover {
            background: rgba(79, 195, 247, 0.4);
        }

        .controls label {
            color: #4fc3f7;
            font-size: 0.9em;
        }

        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #4fc3f7;
            transition: opacity 1s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            border: 5px solid #4fc3f7;
            border-top: 5px solid #81d4fa;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <canvas id="webgl-canvas"></canvas>
    <audio id="background-audio">
        <source src="assets/audio/water-breathing.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
    <div class="overlay">
        <div class="title">水の呼吸<br>Water Breathing - Infinity Arc</div>
        <div class="subtitle">A special gift for someone special ✨</div>
        <div class="controls">
            <button id="playPause">⏸️ Pause</button>
            <button id="resetCamera">🔄 Reset View</button>
            <button id="muteToggle">🔊 Mute</button>
            <label for="speedSlider">Speed:</label>
            <input type="range" id="speedSlider" min="0.1" max="2" step="0.1" value="1">
            <label for="volumeSlider">Volume:</label>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>
    <div id="loading">
        <div class="loader"></div>
        <p>Preparing the Infinity Arc...</p>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="js/infinity-arc.js"></script>
    <script src="js/particle-system.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
